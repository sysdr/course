syntax = "proto3";

package logprocessing;

// Main log entry message with production-grade fields
message LogEntry {
  string timestamp = 1;
  string level = 2;  // INFO, WARN, ERROR, DEBUG
  string service = 3;
  string message = 4;
  string request_id = 5;
  int64 response_time_ms = 6;
  int32 status_code = 7;
  UserContext user_context = 8;
  repeated string tags = 9;
}

// User context for distributed tracing
message UserContext {
  string user_id = 1;
  string session_id = 2;
  string ip_address = 3;
  string user_agent = 4;
}

// Batch of log entries for efficient processing
message LogBatch {
  repeated LogEntry entries = 1;
  string batch_id = 2;
  int64 batch_timestamp = 3;
}
