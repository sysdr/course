version: '3.8'

services:
  log-normalizer:
    build: .
    volumes:
      - ./sample_logs:/app/sample_logs
      - ./test_results:/app/test_results
    environment:
      - PYTHONPATH=/app
    command: python -m pytest tests/ -v --junit-xml=test_results/results.xml
  
  integration-test:
    build: .
    volumes:
      - ./sample_logs:/app/sample_logs
    environment:
      - PYTHONPATH=/app
    command: python test_integration.py
